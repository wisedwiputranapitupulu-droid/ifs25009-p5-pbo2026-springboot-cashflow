spring:
  application:
    name: ifs25009-p5-pbo2026-springboot-cashflow
  datasource:
    # Default sama dengan .env.example agar aplikasi tidak crash saat .env tidak ada di server
    # (.env tidak ikut ke Git/paket deploy). Nilai asli tetap diambil dari .env / environment variable.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:pbo2026_cashflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: true

server:
  port: ${APP_PORT:${PORT:8080}}
  # Aplikasi berjalan di belakang reverse proxy HTTPS (slif.cloud).
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 8h
      cookie:
        name: CASHFLOWSESSION
        http-only: true
        same-site: lax
  compression:
    enabled: true
    min-response-size: 512
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,application/manifest+json,image/svg+xml

app:
  root-username: ${ROOT_USERNAME:admin}
  root-password: ${ROOT_PASSWORD:admin}
  upload-dir: ${UPLOAD_DIR:uploads}
  # Dipakai otomatis bila PostgreSQL tidak bisa dihubungi (mis. di server tanpa DB), supaya web tetap hidup.
  fallback-database-url: ${DB_FALLBACK_URL:jdbc:h2:file:./data/cashflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}

vaadin:
  launch-browser: false
  liveReload:
    enabled: true
